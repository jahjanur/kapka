name: CI

# Everything goes straight to main, so CI on push is the safety net rather
# than a pull-request gate. Runs on every branch anyway, in case one is used.
on:
  push:
  pull_request:

# A second push supersedes the first — no point finishing a run for a commit
# that is already old. Never cancel on main, where the result is the record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Skip git hook installation. The hooks are for developer machines; CI
      # runs the same checks directly and does not commit anything.
      HUSKY: 0
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install — installs exactly the lockfile and fails if
      # package.json and the lock have drifted apart.
      - name: Install
        run: npm ci

      # Cheapest checks first, so a trivial mistake fails in seconds.
      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      # Last, because a broken build is the slowest thing to discover and the
      # rarest to hit once the checks above pass.
      # The placeholder DSN is not decoration. Vite inlines
      # import.meta.env.VITE_SENTRY_DSN, so a build without one tree-shakes the
      # Sentry SDK out entirely — and the budget below would then measure an
      # app 29kB lighter than the one production ships, which is exactly the
      # regression it exists to catch.
      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: https://ci-placeholder@o0.ingest.sentry.io/0

      # Chromium only. The two end-to-end flows are about what the product
      # does, not about browser differences — the unit suite and the
      # responsive pass cover the rendering — and installing three engines
      # would cost more than both specs put together.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The real browser against the real API against a real PostgreSQL, at
      # 390 and 1280. It starts its own embedded database and applies the
      # migrations, so there is no service container to declare here.
      - name: End-to-end
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # Bytes are deterministic, so this is a hard gate and it is cheap: it
      # reads dist/ and gzips it. §11's number, measured rather than asserted
      # in a comment.
      - name: Performance budget
        run: npm run perf:budget

      # LCP and CLS need a browser, so this is the slow one. Three runs per
      # URL, median asserted — see lighthouserc.cjs for why each threshold is
      # the number it is.
      - name: Lighthouse
        run: npm run perf:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
