<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--
      Content Security Policy (§12). Shipped in the document so it applies
      wherever this is hosted, rather than depending on a header the host
      may or may not be configured to send.

      script-src carries a hash, not 'unsafe-inline': the one inline script
      here is the theme applied before first paint, and its hash is checked
      against the script by bundle/csp.test.ts — edit one without the other
      and the build fails rather than the page silently breaking.

      style-src has to allow inline. The layout primitives pass their values
      through the style attribute by design (Grid's --col-min, Skeleton's
      width), which is a shape no hash can cover.

      img-src allows OpenStreetMap because the map tiles come from there.
      connect-src is 'self' because the API is served from the same origin;
      a deployment that splits them has to add the API origin here.

      frame-ancestors is deliberately absent: a browser ignores it in a meta
      element and says so in the console on every load. It lives in
      public/_headers, with the other directives only a real header can
      carry.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-DwRj04hfjcXprycgjHSADDS+mzHOtGteZyc+l7YEWHQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self';"
    />
    <title>Kapka</title>
    <meta
      name="description"
      content="Urgent blood donation matching — find compatible, eligible donors nearby in seconds."
    />

    <!-- Set the theme before first paint so a dark-mode user never gets a
         white flash. Mirrors the storage key in src/lib/theme.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kapka.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* no stored preference — fall through to the OS setting */
        }
      })();
    </script>

    <!-- Preload only the Latin subset: it is on the critical path for every
         page today. The Cyrillic subset is declared with a unicode-range and
         fetched on demand, so preloading it would cost 18KB nobody uses until
         the product is translated.

         crossorigin is required even same-origin — fonts are fetched in CORS
         mode, and without it the preload is discarded and the file downloaded
         a second time. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
