<!doctype html>
<!--
  data-theme is set here and never changes. The product is light-only: the
  tokens still carry a dark palette, but it is reachable only through
  [data-theme="dark"] or the absence of this attribute, so pinning it here is
  what keeps a reader whose OS is dark from getting half a dark UI with no
  control to change it back.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--
      Content Security Policy (§12). Shipped in the document so it applies
      wherever this is hosted, rather than depending on a header the host
      may or may not be configured to send.

      script-src is 'self' and nothing else. There is no inline script to
      allow: the one that used to be here applied a stored theme before first
      paint, and the product is light-only now. Adding another means adding
      its hash — never 'unsafe-inline', which csp.test.ts refuses.

      style-src has to allow inline. The layout primitives pass their values
      through the style attribute by design (Grid's --col-min, Skeleton's
      width), which is a shape no hash can cover.

      img-src allows OpenStreetMap because the map tiles come from there. Both
      spellings of the host, because a CSP wildcard matches a subdomain and
      not the bare name: *.tile.openstreetmap.org does not cover
      tile.openstreetmap.org, which is the host HospitalMap actually asks for,
      and every tile was being blocked.
      connect-src is 'self' because the API is served from the same origin;
      a deployment that splits them has to add the API origin here.

      frame-ancestors is deliberately absent: a browser ignores it in a meta
      element and says so in the console on every load. It lives in
      public/_headers, with the other directives only a real header can
      carry.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self';"
    />
    <title>Kapka</title>
    <meta
      name="description"
      content="Urgent blood donation matching — find compatible, eligible donors nearby in seconds."
    />

    <!-- Preload only the Latin subset: it is on the critical path for every
         page today. The Cyrillic subset is declared with a unicode-range and
         fetched on demand, so preloading it would cost 18KB nobody uses until
         the product is translated.

         crossorigin is required even same-origin — fonts are fetched in CORS
         mode, and without it the preload is discarded and the file downloaded
         a second time. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
