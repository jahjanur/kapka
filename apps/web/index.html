<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kapka</title>
    <meta
      name="description"
      content="Urgent blood donation matching — find compatible, eligible donors nearby in seconds."
    />

    <!-- Set the theme before first paint so a dark-mode user never gets a
         white flash. Mirrors the storage key in src/lib/theme.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kapka.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* no stored preference — fall through to the OS setting */
        }
      })();
    </script>

    <!-- Preload only the Latin subset: it is on the critical path for every
         page today. The Cyrillic subset is declared with a unicode-range and
         fetched on demand, so preloading it would cost 18KB nobody uses until
         the product is translated.

         crossorigin is required even same-origin — fonts are fetched in CORS
         mode, and without it the preload is discarded and the file downloaded
         a second time. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
